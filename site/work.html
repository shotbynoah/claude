<style>
/* Inlined from style.css so this page renders standalone in preview sandboxes. */
:root{--bg:#ffffff;--ink:#0b0b0c;--ink-dim:#6f6f74;--line:#e8e8e6;--panel:#f2f2ef;--maxw:1200px;--pad:clamp(20px,5vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
.site-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:15px var(--pad);border-bottom:1px solid var(--line);background:var(--bg)}
.site-nav{justify-self:start;display:flex;gap:clamp(16px,2.6vw,32px)}
.site-nav a{color:var(--ink-dim);font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:color .25s ease;padding-bottom:2px}
.site-nav a:hover,.site-nav a[aria-current="page"]{color:var(--ink)}
.brand{justify-self:center;display:flex;align-items:center;gap:10px}
.brand img{height:34px;width:auto}
.brand .wordmark{font-size:13px;font-weight:600;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase}
.site-footer{display:flex;justify-content:center;gap:clamp(20px,4vw,36px);padding:clamp(18px,3vw,28px) var(--pad);font-size:11px;letter-spacing:.2em;text-transform:uppercase;border-top:1px solid var(--line)}
.site-footer a{color:var(--ink-dim);transition:color .25s ease}
.site-footer a:hover{color:var(--ink)}
.section{padding:clamp(48px,8vw,96px) var(--pad);max-width:var(--maxw);margin:0 auto}
.section-label{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:clamp(22px,3vw,36px)}
.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,1.6vw,20px)}
.work-item{position:relative;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.work-item.photo{aspect-ratio:4/5}
.work-item img,.work-item video{width:100%;height:100%;object-fit:cover}
.work-item .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.span-2{grid-column:1/-1;aspect-ratio:21/9}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:clamp(8px,1vw,14px)}
.gallery .work-item{aspect-ratio:4/5}
.gallery .work-item.wide{grid-column:span 2;aspect-ratio:16/9}
.reel-feature{display:flex;justify-content:center;margin-bottom:clamp(20px,3vw,40px)}
.reel-feature video{max-height:78svh;width:auto;max-width:100%;border:1px solid var(--line);background:#000}
.video-masonry{column-count:2;column-gap:clamp(8px,1vw,14px)}
@media (max-width:560px){.video-masonry{column-count:1}}
.clip{break-inside:avoid;margin:0 0 clamp(8px,1vw,14px)}
.clip video{width:100%;height:auto;display:block;background:#000;border:1px solid var(--line)}
.clip .cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-top:8px}
@media (max-width:520px){.gallery{grid-template-columns:repeat(2,1fr)}}
.clients-band{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.logo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:clamp(10px,1.4vw,18px);max-width:960px;margin:0 auto}
.logo-grid .logo{aspect-ratio:5/3;border:1px solid var(--line);background:#fff;overflow:hidden}
.logo-grid .logo img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:520px){.logo-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.site-header{grid-template-columns:1fr;justify-items:center;gap:12px;text-align:center}.site-nav{justify-self:center}.brand{order:-1}}
@media (max-width:720px){.work-grid{grid-template-columns:1fr}.work-item,.span-2{aspect-ratio:16/9}}
</style>
</head>
