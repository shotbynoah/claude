<style>
/* Inlined from style.css so this page renders standalone in preview sandboxes. */
:root{--bg:#ffffff;--ink:#0b0b0c;--ink-dim:#6f6f74;--line:#e8e8e6;--panel:#f2f2ef;--maxw:1200px;--pad:clamp(20px,5vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
.site-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:15px var(--pad);border-bottom:1px solid var(--line);background:var(--bg)}
.site-nav{justify-self:start;display:flex;gap:clamp(16px,2.6vw,32px)}
.site-nav a{color:var(--ink-dim);font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:color .25s ease;padding-bottom:2px}
.site-nav a:hover,.site-nav a[aria-current="page"]{color:var(--ink)}
.brand{justify-self:center;display:flex;align-items:center;gap:10px}
.brand img{height:34px;width:auto}
.brand .wordmark{font-size:13px;font-weight:600;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase}
.site-footer{display:flex;justify-content:center;gap:clamp(20px,4vw,36px);padding:clamp(18px,3vw,28px) var(--pad);font-size:11px;letter-spacing:.2em;text-transform:uppercase;border-top:1px solid var(--line)}
.site-footer a{color:var(--ink-dim);transition:color .25s ease}
.site-footer a:hover{color:var(--ink)}
.section{padding:clamp(48px,8vw,96px) var(--pad);max-width:var(--maxw);margin:0 auto}
.section-label{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:clamp(22px,3vw,36px)}
.work-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(12px,1.6vw,20px)}
.work-item{position:relative;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.work-item.photo{aspect-ratio:4/5}
.work-item img,.work-item video{width:100%;height:100%;object-fit:cover}
.work-item .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.span-2{grid-column:1/-1;aspect-ratio:21/9}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:clamp(8px,1vw,14px)}
.gallery .work-item{aspect-ratio:4/5}
.gallery .work-item.wide{grid-column:span 2;aspect-ratio:16/9}
.reel-feature{display:flex;justify-content:center;margin-bottom:clamp(20px,3vw,40px)}
.reel-feature video{max-height:78svh;width:auto;max-width:100%;border:1px solid var(--line);background:#000}
.video-masonry{column-count:2;column-gap:clamp(8px,1vw,14px)}
@media (max-width:560px){.video-masonry{column-count:1}}
.clip{break-inside:avoid;margin:0 0 clamp(8px,1vw,14px)}
.clip video{width:100%;height:auto;display:block;background:#000;border:1px solid var(--line)}
.clip .cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin-top:8px}
@media (max-width:520px){.gallery{grid-template-columns:repeat(2,1fr)}}
.clients-band{background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.logo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:clamp(10px,1.4vw,18px);max-width:960px;margin:0 auto}
.logo-grid .logo{aspect-ratio:5/3;border:1px solid var(--line);background:#fff;overflow:hidden}
.logo-grid .logo img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:520px){.logo-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.site-header{grid-template-columns:1fr;justify-items:center;gap:12px;text-align:center}.site-nav{justify-self:center}.brand{order:-1}}
@media (max-width:720px){.work-grid{grid-template-columns:1fr}.work-item,.span-2{aspect-ratio:16/9}}
/* work page */
.sr-only{position: absolute;width: 1px;height: 1px;overflow: hidden;clip: rect(0 0 0 0);white-space: nowrap}.work{max-width: 1280px;margin: 0 auto;padding: clamp(20px,3vw,36px) clamp(16px,2.2vw,32px) clamp(40px,6vw,80px)}.work-filter{display: flex;gap: clamp(18px,2.4vw,28px);margin-bottom: clamp(14px,2vw,22px)}.work-filter a{font-size: 11px;letter-spacing: .18em;text-transform: uppercase;color: var(--ink-dim);padding-bottom: 3px;border-bottom: 1px solid transparent;transition: color .25s ease,border-color .25s ease}.work-filter a:hover{color: var(--ink)}.work-filter a[aria-current="true"]{color: var(--ink);border-bottom-color: var(--ink)}.mosaic{display: flex;align-items: flex-start;gap: 0}.mosaic-col{flex: 1 1 0;min-width: 0}.mosaic:not(.ready){display: block;column-count: 2;column-gap: 0}.mosaic:not(.ready) .tile{break-inside: avoid}@media (min-width: 720px){.mosaic:not(.ready){column-count: 3}}@media (min-width: 1100px){.mosaic:not(.ready){column-count: 4}}.tile{position: relative;display: block;width: 100%;padding: 0;margin: 0;border: 0;background: var(--panel);overflow: hidden;cursor: pointer;text-align: left;font: inherit;color: inherit}.tile img{display: block;width: 100%;height: auto;transition: transform .9s cubic-bezier(0,0,.2,1)}.tile:hover img,.tile:focus-visible img{transform: scale(1.02)}.tile:focus-visible{outline: 2px solid var(--ink);outline-offset: -2px}.tile .play{position: absolute;top: 10px;right: 10px;width: 26px;height: 26px;border-radius: 50%;background: rgba(11,11,12,.55);backdrop-filter: blur(4px);-webkit-backdrop-filter: blur(4px);pointer-events: none}.tile .play::after{content: "";position: absolute;left: 10px;top: 7px;border-left: 8px solid #fff;border-top: 6px solid transparent;border-bottom: 6px solid transparent}.js .tile{opacity: 0;transform: translateY(10px);transition: opacity .6s ease,transform .6s ease}.js .tile.in{opacity: 1;transform: none}@media (prefers-reduced-motion: reduce){.js .tile{opacity: 1;transform: none;transition: none}.tile img{transition: none}}.lb{position: fixed;inset: 0;z-index: 50;background: #fff;display: flex;align-items: center;justify-content: center}.lb[hidden]{display: none}.lb-stage{max-width: min(92vw,1100px);max-height: calc(100svh - 120px);display: flex;align-items: center;justify-content: center}.lb-stage img,.lb-stage video{max-width: 100%;max-height: calc(100svh - 120px);width: auto;height: auto;background: #000}.lb-stage img{background: transparent}.lb-close,.lb-nav{position: absolute;background: none;border: 0;cursor: pointer;font: inherit;color: var(--ink-dim);font-size: 11px;letter-spacing: .18em;text-transform: uppercase;transition: color .2s ease}.lb-close:hover,.lb-nav:hover{color: var(--ink)}.lb-close{top: 20px;right: clamp(16px,3vw,32px);padding: 8px}.lb-nav{top: 50%;transform: translateY(-50%);font-size: 22px;letter-spacing: 0;padding: 16px}.lb-prev{left: clamp(4px,2vw,24px)}.lb-next{right: clamp(4px,2vw,24px)}.lb-meta{position: absolute;left: 0;right: 0;bottom: 20px;display: flex;justify-content: center;gap: 14px;font-size: 10px;letter-spacing: .06em;text-transform: uppercase}.lb-count{color: var(--ink-dim)}body.lb-open{overflow: hidden}
</style>

  <script>
(function () {
  var grid = document.getElementById('mosaic');
  var all = [].slice.call(grid.querySelectorAll('.tile'));
  var links = [].slice.call(document.querySelectorAll('.work-filter a'));
  var filter = 'all', current = [], idx = 0, lastFocus = null;

  function colCount() { var w = window.innerWidth; return w >= 1100 ? 4 : w >= 720 ? 3 : 2; }
  function ratio(t) { var i = t.querySelector('img'); return i.getAttribute('height') / i.getAttribute('width'); }

  function layout() {
    var n = colCount(), cols = [], heights = [];
    current = all.filter(function (t) { return filter === 'all' || t.getAttribute('data-type') === filter; });
    all.forEach(function (t) { if (t.parentNode) t.parentNode.removeChild(t); });
    grid.innerHTML = '';
    for (var i = 0; i < n; i++) { var c = document.createElement('div'); c.className = 'mosaic-col'; grid.appendChild(c); cols.push(c); heights.push(0); }
    current.forEach(function (t) {
      var k = heights.indexOf(Math.min.apply(null, heights));
      cols[k].appendChild(t); heights[k] += ratio(t);
    });
    grid.classList.add('ready');
    reveal();
  }

  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -5% 0px' }) : null;
  function reveal() {
    current.forEach(function (t) { if (t.classList.contains('in')) return; if (io) io.observe(t); else t.classList.add('in'); });
  }

  function applyHash() {
    var h = (location.hash || '#all').slice(1);
    filter = (h === 'video' || h === 'photo') ? h : 'all';
    links.forEach(function (a) { a.setAttribute('aria-current', a.getAttribute('data-filter') === filter ? 'true' : 'false'); });
    layout();
  }
  window.addEventListener('hashchange', applyHash);
  var lastCols = colCount(), rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { var n = colCount(); if (n !== lastCols) { lastCols = n; layout(); } }, 150);
  });

  /* ---------- viewer ---------- */
  var lb = document.getElementById('lb'), stage = document.getElementById('lbStage'), count = lb.querySelector('.lb-count');
  function show(i) {
    idx = (i + current.length) % current.length;
    var t = current[idx], v = t.getAttribute('data-video'), img = t.querySelector('img');
    stage.innerHTML = '';
    var el;
    if (v) {
      el = document.createElement('video');
      el.controls = true; el.autoplay = true; el.loop = true; el.playsInline = true;
      el.setAttribute('playsinline', ''); el.poster = img.getAttribute('src'); el.src = v;
    } else {
      el = document.createElement('img'); el.src = img.getAttribute('src'); el.alt = img.alt;
    }
    stage.appendChild(el);
    count.textContent = (idx + 1) + ' / ' + current.length;
  }
  function open(t) {
    lastFocus = t; show(current.indexOf(t));
    lb.hidden = false; document.body.classList.add('lb-open');
    lb.querySelector('.lb-close').focus();
  }
  function close() {
    var v = stage.querySelector('video'); if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
    stage.innerHTML = ''; lb.hidden = true; document.body.classList.remove('lb-open');
    if (lastFocus) lastFocus.focus();
  }
  grid.addEventListener('click', function (e) { var t = e.target.closest('.tile'); if (t) open(t); });
  lb.querySelector('.lb-close').addEventListener('click', close);
  lb.querySelector('.lb-prev').addEventListener('click', function () { show(idx - 1); });
  lb.querySelector('.lb-next').addEventListener('click', function () { show(idx + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(idx - 1);
    else if (e.key === 'ArrowRight') show(idx + 1);
  });
  var sx = null;
  lb.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (sx === null || e.target.closest('video')) { sx = null; return; }
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
  });

  applyHash();
})();

  </script>
